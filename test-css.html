<!DOCTYPE html>
<html style="height: 100%;">
<head>
<style>
body { margin: 0; height: 100%; display: flex; flex-direction: column; }
.scroll-container { flex: 1; overflow-y: auto; display: flex; }
.left-section { flex: 1; background: #fee; display: flex; flex-direction: column; }
.right-section { flex: 1; background: #eef; display: flex; flex-direction: column; }

/* TextPanel */
.text-panel { flex: 1; } 
.tall-content { height: 2000px; background: rgba(255,0,0,0.2); }

/* CanvasPanel */
.canvas-panel { flex: 1; display: flex; flex-direction: column; }
.canvas { flex: 1; background: rgba(0,0,255,0.2); }
</style>
</head>
<body>
  <div class="scroll-container">
    <div class="left-section">
      <div class="text-panel">
        <div class="tall-content">Tall Text</div>
      </div>
    </div>
    <div class="right-section">
      <div class="canvas-panel">
        <div class="canvas">Canvas stretches to 2000px!</div>
      </div>
    </div>
  </div>
</body>
</html>

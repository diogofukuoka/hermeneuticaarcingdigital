<!DOCTYPE html>
<html style="height: 100%;">
<head>
<style>
body { margin: 0; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
.main { flex: 1; overflow: hidden; display: flex; }
.scroll-area { flex: 1; overflow-y: auto; display: flex; align-items: stretch; }
.left { width: 50%; background: #fee; display: flex; flex-direction: column; }
.right { width: 50%; background: #eef; display: flex; flex-direction: column; }
.left-content { height: 2000px; background: rgba(255,0,0,0.2); }
.right-panel { flex: 1; display: flex; flex-direction: column; }
.canvas { flex: 1; background: rgba(0,0,255,0.2); border: 2px solid blue; }
</style>
</head>
<body>
  <div class="main">
    <div class="scroll-area">
      <div class="left">
        <div class="left-content">Tall Text</div>
      </div>
      <div class="right">
        <div class="right-panel">
          <div class="canvas">Canvas</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
